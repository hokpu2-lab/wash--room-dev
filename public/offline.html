<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>離線紙本流程｜洗衣管理系統</title>
    <style>
      body { margin: 0; font: 16px/1.6 sans-serif; color: #123d33; background: #f4f7f5; }
      main { max-width: 40rem; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { font-family: Georgia, "Noto Serif TC", serif; }
      ol { padding-left: 1.2rem; }
      p { color: #49666b; }
    </style>
  </head>
  <body>
    <main>
      <p>OFFLINE PAPER PROCESS</p>
      <h1>離線紙本流程</h1>
      <p>目前沒有網路。系統不會排隊送單、收單、洗烘或取件。請依紙本步驟操作，恢復連線後再掃固定 QR。</p>
      <ol>
        <li>送洗人員：將衣物放入固定洗衣車，恢復連線後再掃車卡送單。</li>
        <li>洗衣員：依車卡與設備固定 QR 執行目前允許的控制點，不要手寫狀態。</li>
        <li>取件：所有必要批次裝車後，再掃來源車完成取件。</li>
      </ol>
      <p>此頁不含帳號、QR token 或營運資料。</p>
    </main>
  </body>
</html>
