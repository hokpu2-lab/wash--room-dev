      el("helpUser").addEventListener("click",() => openDrawer("help"));
      el("notificationBtn").addEventListener("click",() => openDrawer("notifications"));
      el("suggestionBtn").addEventListener("click",() => openDrawer("suggestions"));
      el("prevVariant").addEventListener("click",() => changeVariant(-1));
      el("nextVariant").addEventListener("click",() => changeVariant(1));
      el("searchInput").addEventListener("input",(event) => { query = event.target.value; render(); });
      window.addEventListener("keydown",(event) => { if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); return openCommand(); } if (event.key === "Escape") return closeDrawer(); if (event.target.matches("input,textarea,select,[contenteditable]")) return; if (event.key === "ArrowLeft") changeVariant(-1); if (event.key === "ArrowRight") changeVariant(1); });
      render();
    })();
  </script>
</body>
</html>
